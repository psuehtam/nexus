services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: i9
      POSTGRES_USER: i9
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env e configure POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i9 -d i9"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://i9:${POSTGRES_PASSWORD}@postgres:5432/i9
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Configure ADMIN_API_KEY in .env}
      ALLOW_SOURCE_DOWNLOAD: ${ALLOW_SOURCE_DOWNLOAD:-false}
      I9_CATALOG_AUTO_REFRESH: "false"
      I9_ON_DEMAND_WORKER: "true"
      I9_CHECK_ON_START: "true"
      I9_UPDATES_PAUSED: ${I9_UPDATES_PAUSED:-true}
      I9_MAX_DOWNLOAD_BYTES: ${I9_MAX_DOWNLOAD_BYTES:-500000000}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    environment: *app-environment
    ports: ["127.0.0.1:${NEXUS_HOST_PORT:-8000}:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  worker:
    profiles: ["maintenance"]
    build: .
    command: ["python", "-m", "src.worker", "--no-schedule"]
    environment: *app-environment
    volumes: ["./data:/app/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  metabase-db:
    image: postgres:17
    profiles: ["bi"]
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["metabase-data:/var/lib/postgresql/data"]

  metabase:
    image: metabase/metabase:latest
    profiles: ["bi"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: metabase-db
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [metabase-db, postgres]

volumes:
  postgres-data:
  metabase-data:
